name: E2E (manual)

# 只做手动触发：e2e 依赖 Playwright 的 msedge 通道（ubuntu 上要额外下载浏览器，
# 且部分用例需要模型/数据，天然不稳定），因此不挂在每次 push 上，避免给人「CI 全绿」
# 的错觉。需要时在 Actions 页面点 Run workflow，可指定要跑的 spec 列表。

on:
  workflow_dispatch:
    inputs:
      specs:
        description: "要跑的 spec（空格分隔；默认只跑无障碍/验证码这条稳定的）"
        required: false
        default: "e2e/captcha-accessibility.spec.ts"
      demo_mode:
        description: "DEMO_MODE（true = 不调外部模型，用本地模板）"
        required: false
        default: "true"

jobs:
  e2e:
    name: playwright (windows-latest / msedge)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      DEMO_MODE: ${{ github.event.inputs.demo_mode }}
      DATA_DIR: ${{ github.workspace }}\01_ICT主工程\roadshow-seed
      LOG_DIR: ${{ github.workspace }}\roadshow-logs
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 01_ICT主工程/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 01_ICT主工程/frontend-vue/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r 01_ICT主工程/backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: 01_ICT主工程/frontend-vue
        run: npm ci --no-audit --no-fund

      - name: Start backend (8000)
        working-directory: 01_ICT主工程/backend
        shell: pwsh
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}\01_ICT主工程\backend;${{ github.workspace }}\01_ICT主工程"
          Start-Process -FilePath "python" -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","8000" -NoNewWindow -RedirectStandardOutput "${{ github.workspace }}\backend.log" -RedirectStandardError "${{ github.workspace }}\backend.err.log"
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { Write-Host "backend ready"; exit 0 }
            } catch { Start-Sleep -Seconds 2 }
          }
          Write-Host "backend failed to start"; Get-Content "${{ github.workspace }}\backend.err.log" -Tail 80; exit 1

      - name: Start dev server (5173)
        working-directory: 01_ICT主工程/frontend-vue
        shell: pwsh
        run: |
          Start-Process -FilePath "node" -ArgumentList "scripts/dev-server.mjs" -NoNewWindow -RedirectStandardOutput "${{ github.workspace }}\frontend.log" -RedirectStandardError "${{ github.workspace }}\frontend.err.log"
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:5173/" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { Write-Host "frontend ready"; exit 0 }
            } catch { Start-Sleep -Seconds 2 }
          }
          Write-Host "frontend failed to start"; Get-Content "${{ github.workspace }}\frontend.log" -Tail 80; exit 1

      - name: Run selected specs
        working-directory: 01_ICT主工程/frontend-vue
        run: npx playwright test ${{ github.event.inputs.specs }} --reporter=line --workers=1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          if-no-files-found: ignore
          path: |
            01_ICT主工程/frontend-vue/test-results
            01_ICT主工程/frontend-vue/playwright-report
            backend.log
            backend.err.log
            frontend.log
            frontend.err.log
