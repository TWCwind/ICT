name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_ICT主工程/backend
    env:
      # 仓库里 backend/data 被 .gitignore 排除，可用的数据快照是 roadshow-seed。
      DATA_DIR: ${{ github.workspace }}/01_ICT主工程/roadshow-seed
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 01_ICT主工程/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -t tests -p "test*.py" -v

  mcp-tests:
    name: MCP server tests
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ github.workspace }}/01_ICT主工程/roadshow-seed
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            01_ICT主工程/backend/requirements.txt
            mcp_server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 01_ICT主工程/backend/requirements.txt -r mcp_server/requirements.txt
      - name: Run MCP tests (services + hardening)
        run: python -m unittest discover -s mcp_server/tests -t . -p "test*.py" -v

  eval-static:
    name: evaluation harness (static, no LLM calls)
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ github.workspace }}/01_ICT主工程/roadshow-seed
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            01_ICT主工程/backend/requirements.txt
            mcp_server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 01_ICT主工程/backend/requirements.txt -r mcp_server/requirements.txt
      - name: Static cross-check of the 50-condition set
        working-directory: 01_ICT主工程
        run: python scripts/eval/run_eval.py
      - name: Nine-step role pipeline determinism
        working-directory: 01_ICT主工程
        run: python scripts/eval/test_role_pipeline.py
      - name: Citation and chapter evidence regressions
        working-directory: 01_ICT主工程
        run: python scripts/eval/test_evidence_regressions.py
      - name: Tool schema matches the eval set
        working-directory: 01_ICT主工程
        run: python scripts/eval/answer_eval.py --list-tools

  frontend-build:
    name: frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_ICT主工程/frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 01_ICT主工程/frontend-vue/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Production build
        run: npx vite build
